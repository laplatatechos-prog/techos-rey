/* Layout: planilla de clientes (filas con botones de acción); ficha del cliente con 5 herramientas grandes; hojas que suben desde abajo para cada acción. Siempre tema claro. */
:root{
  color-scheme:light;
  --bg:#f2f3f7; --sup:#ffffff; --sup2:#f6f7fa; --fg:#151c33; --suave:#5b6480; --linea:#dfe2ea;
  --azul:#16264a; --azul-t:#ffffff; --oro:#c4951a; --oro-t:#1d1503; --wa:#1fa855;
  --e-llamar:#2563c9; --e-llamar-f:#e4edfb; --e-visita:#7a45d6; --e-visita-f:#efe8fc;
  --e-presupuestar:#b86e00; --e-presupuestar-f:#fdf0d6; --e-ejecutar:#0b8a7e; --e-ejecutar-f:#dbf2ef;
  --e-cobrar:#1f8a3c; --e-cobrar-f:#e0f4e5; --e-terminado:#6b7280; --e-terminado-f:#eceef1;
  --e-reclamo:#d0312d; --e-reclamo-f:#fbe4e3;
  --display:"Archivo",system-ui,sans-serif; --texto:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --sombra:0 1px 2px rgba(20,28,51,.06),0 2px 10px rgba(20,28,51,.05);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font:16px/1.45 var(--texto);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--azul)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--azul);color:var(--azul-t);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.marca{font-family:var(--display);font-weight:800;font-size:20px;display:flex;align-items:center;gap:9px}
.marca b{color:#e8c25a}
.sub{font-size:13.5px;opacity:.85;margin-top:1px}
main{max-width:1120px;margin:0 auto;padding-block:16px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

nav button{flex:1;border:0;background:none;color:var(--suave);font:600 14px var(--texto);padding:10px 2px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;cursor:pointer}

.fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.qe-caja button+button{background:var(--oro);color:var(--oro-t)}
</style>

function lista(o){return Object.keys(o).map(function(k){var v=o[k];v.id=k;return v})}
function cli(id){return S.clientes[id]||{nombre:"(sin cliente)"}}
function soloNum(t){return String(t||"").replace(/\D/g,"")}
function waLink(tel,txt){return"https://wa.me/"+soloNum(tel)+(txt?"?text="+encodeURIComponent(txt):"")}
function telLindo(t){var n=soloNum(t);if(n.indexOf("549")==0)n=n.slice(3);return n.length==10?n.slice(0,3)+" "+n.slice(3,6)+"-"+n.slice(6):(t||"")}
function hace(ms){var m=Math.round((Date.now()-ms)/60000);if(m<1)return"recién";if(m<60)return"hace "+m+" min";var h=Math.round(m/60);if(h<24)return"hace "+h+" h";return new Date(ms).toLocaleDateString("es-AR",{day:"numeric",month:"short"})}
function trabajosDe(cid){return lista(S.trabajos).filter(function(t){return t.clienteId==cid})}
function trabajoActivo(cid){var ts=trabajosDe(cid).filter(function(t){return!t.hecho&&est(t.estado)!="terminado"});ts.sort(function(a,b){return((a.fecha||"9")+(a.hora||""))<((b.fecha||"9")+(b.hora||""))?-1:1});return ts[0]||trabajosDe(cid)[0]||null}
function agendaDe(cid){return lista(S.agenda).filter(function(a){return(!cid||a.clienteId==cid)&&a.estado!="borrado"}).sort(function(a,b){return(a.fecha+(a.hora||""))<(b.fecha+(b.hora||""))?-1:1})}
function proxEvento(cid){var h=iso();return agendaDe(cid).filter(function(a){return a.fecha>=h&&a.estado!="hecho"})[0]||null}
function queQuedo(c){var t=trabajoActivo(c.id),ev=proxEvento(c.id);return{que:(ev&&ev.que)||(t&&t.proxima)||QUE_E[est(c.estado)],f:(ev&&ev.fecha)||(t&&t.fecha)||"",h:(ev&&ev.hora)||(t&&t.hora)||""}}
function chatDe(cid){return lista(S.chats).filter(function(m){return m.clienteId==cid}).sort(function(a,b){return(a.ts||0)-(b.ts||0)})}
function novedades(){return lista(S.avisos).filter(function(a){return a.estado!="atendido"}).sort(function(a,b){return(b.ts||0)-(a.ts||0)})}

/* ---------- arranque ---------- */
async function iniciar(){pintar();
  db=await claude.use("db");
  if(!db){$("sub").textContent="Sin conexión";$("app").innerHTML='<div class="card vacio">No hay conexión con la base. Revisá internet y volvé a abrir.</div>';return}
  var timer=setTimeout(function(){$("sub").textContent="La base tarda en responder…"},10000);
  ["clientes","trabajos","historia","avisos","mensajes","chats","agenda"].forEach(function(col){
    db.collection(col).onSnapshot(function(snap){clearTimeout(timer);var o={};snap.docs.forEach(function(d){o[d.id]=d.data()});S[col]=o;sub();if(!$("hoja").hidden&&S._hojaViva)S._hojaViva();else pintar()},
      function(e){clearTimeout(timer);$("sub").textContent="No pude leer la base ("+e.code+")"})});
  claude.use("tts").then(function(x){tts=x});
  claude.use("dictation").then(function(x){dict=x});
  claude.use("mcp").then(function(x){mcp=x});
  claude.use("user").then(async function(x){if(!x)return;try{var me=await x.me();S.yo=((me&&me.name)||"").split(" ")[0];sub()}catch(e){}});
}
function sub(){var n=novedades().length,h=iso(),hoy=agendaDe().filter(function(a){return a.fecha==h&&a.estado!="hecho"}).length;
  $("sub").textContent=(S.yo?"Hola, "+S.yo+" · ":"")+Object.keys(S.clientes).length+" clientes"+(hoy?" · "+hoy+" para hoy":"")+(n?" · "+n+" novedades":"");
  var b=$("nAv");b.hidden=!n;b.textContent=n}

/* ---------- pantallas ---------- */
function pintar(){document.querySelectorAll("#nav button").forEach(function(b){b.setAttribute("aria-current",b.dataset.t==S.tab?"page":"false")});
  $("app").innerHTML=S.tab=="clientes"?(S.abierto&&S.clientes[S.abierto]?pFicha():pPlanilla()):S.tab=="hoy"?pCalendario():pNovedades();ligar();
  var bu=$("buscar");if(bu&&S._foco){bu.focus();bu.setSelectionRange(bu.value.length,bu.value.length)}}

function pPlanilla(){var todos=lista(S.clientes),cuenta={};todos.forEach(function(c){var e=est(c.estado);cuenta[e]=(cuenta[e]||0)+1});
  var orden=ESTADOS.slice().sort(function(a,b){return ORDEN[a]-ORDEN[b]});
  var l=todos.filter(function(c){return(!S.filtro||est(c.estado)==S.filtro)&&(!S.buscar||(c.nombre+" "+(c.direccion||"")+" "+(c.telefono||"")+" "+(c.zona||"")).toLowerCase().indexOf(S.buscar)>=0)});
  l.sort(function(a,b){var d=ORDEN[est(a.estado)]-ORDEN[est(b.estado)];if(d)return d;var qa=queQuedo(a),qb=queQuedo(b);return(qa.f||"9")<(qb.f||"9")?-1:1});
  var s='<input id="buscar" class="buscar" placeholder="Buscar cliente por nombre, calle o teléfono" aria-label="Buscar" value="'+esc(S.buscar)+'">';
  s+='<div class="filtros"><button data-filtro="" aria-pressed="'+(!S.filtro)+'">Todos <span class="n">'+todos.length+'</span></button>'+orden.filter(function(e){return cuenta[e]}).map(function(e){return'<button class="est '+e+'" data-filtro="'+e+'" aria-pressed="'+(S.filtro==e)+'">'+NOMBRE_E[e]+' <span class="n">'+cuenta[e]+'</span></button>'}).join("")+'<button data-nuevo style="border-style:dashed">+ Cliente nuevo</button></div>';
  if(!l.length)return s+'<div class="card vacio">'+(todos.length?"No hay clientes con ese filtro.":"Todavía no hay clientes. Tocá “+ Cliente nuevo”.")+'</div>';
  var h=iso();
  s+='<div class="planilla" role="table"><div class="fila-t cab" role="row"><span></span><span>Cliente</span><span>Estado</span><span>Qué quedó</span><span>Cuándo</span><span>Acciones</span></div>'+
   l.map(function(c){var e=est(c.estado),q=queQuedo(c);return'<div class="fila-t est '+e+'" role="row" tabindex="0" data-abrir="'+esc(c.id)+'"><span class="banda"></span>'+
    '<span class="c-n"><span class="nom">'+esc(c.nombre)+'</span><br><span class="gris">'+esc(c.direccion||c.zona||"sin dirección")+'</span></span>'+
    '<span class="c-e">'+pill(e,'data-cambiar="'+esc(c.id)+'"')+'</span>'+
    '<span class="c-q cel-que">'+esc(q.que)+'</span>'+
    '<span class="c-c cel-cuando'+(q.f&&q.f<h?" tarde":"")+'">'+esc(q.f?cuando(q.f,q.h):"Sin día")+'</span>'+
    '<span class="c-a acc">'+(c.telefono?'<a class="ib wa" href="'+esc(waLink(c.telefono))+'" target="_blank" rel="noopener" title="WhatsApp" aria-label="WhatsApp de '+esc(c.nombre)+'" data-stop>'+IC.wa+'</a>':"")+'<button class="ib" title="Agendar" aria-label="Agendar para '+esc(c.nombre)+'" data-agendar="'+esc(c.id)+'">'+IC.cal+'</button><button class="ib" title="Escuchar" aria-label="Escuchar a '+esc(c.nombre)+'" data-oir="'+esc(c.id)+'">'+IC.oir+'</button></span></div>'}).join("")+'</div>';
  return s}

function pFicha(){var c=S.clientes[S.abierto],e=est(c.estado),q=queQuedo(c),ags=agendaDe(S.abierto),ch=chatDe(S.abierto),hs=lista(S.historia).filter(function(n){return n.clienteId==S.abierto}).sort(function(a,b){return(b.ts||0)-(a.ts||0)}),t=trabajoActivo(S.abierto);
  var s='<div class="pila" style="max-width:760px;margin:0 auto"><button class="volver" data-volver>‹ Todos los clientes</button>';
  s+='<div class="card est '+e+'"><div class="fila" style="justify-content:space-between"><h1 style="font:800 27px/1.15 var(--display);margin:0">'+esc(c.nombre)+'</h1>'+pill(e,'data-cambiar="'+esc(c.id)+'"')+'</div>'+
    '<div class="gris">'+esc([c.telefono?telLindo(c.telefono):"",c.direccion,c.zona].filter(Boolean).join(" · ")||"Faltan los datos")+'</div>'+
    '<div class="quedo"><span class="t">Qué quedó</span><span class="q">'+esc(q.que)+'</span><span>'+esc(q.f?cuando(q.f,q.h):"Sin día todavía")+'</span></div>'+
    (c.falta?'<div class="gris">Falta saber: <b style="color:var(--fg)">'+esc(c.falta)+'</b></div>':"")+
    '<div class="herr">'+
     '<button data-oir="'+esc(c.id)+'">'+IC.oir+'Escuchar</button>'+
     '<button data-conv>'+IC.chat+'Conversación</button>'+
     (c.telefono?'<button class="wa" data-escribir>'+IC.wa+'WhatsApp</button>':'<button data-datos>'+IC.wa+'Poner teléfono</button>')+
     '<button data-agendar="'+esc(c.id)+'">'+IC.cal+'Agendar</button>'+
     '<button data-cambiar="'+esc(c.id)+'">'+IC.est+'Estado</button>'+
    '</div></div>';
  if(c.resumenChat||c.sugerencia)s+='<div class="card"><b>Resumen de la conversación</b>'+(c.resumenChat?'<div>'+esc(c.resumenChat)+'</div>':"")+(c.sugerencia&&c.telefono?'<div class="gris">Para mandarle:</div><div style="background:#dcf5e3;border-radius:10px;padding:10px 12px">'+esc(c.sugerencia)+'</div><div class="fila"><button class="b wa" data-escribir="sug">'+IC.wa+'Mandale esto</button></div>':"")+'</div>';
  s+='<div class="card"><div class="fila" style="justify-content:space-between"><b>Calendario de '+esc(c.nombre.split(" ")[0])+'</b><button class="b" data-agendar="'+esc(c.id)+'">+ Agendar</button></div>'+
    (ags.length?ags.map(function(a){return'<div class="ev"><span class="h'+(a.fecha<iso()&&a.estado!="hecho"?" tarde":"")+'">'+esc(cuando(a.fecha,a.hora))+'</span><span style="flex:1;min-width:0">'+esc(a.que)+(a.estado=="hecho"?' <span class="gris">· hecho</span>':"")+'<br><span class="gris">'+esc(textoAviso(a.avisos))+(a.gcal?" · en Google Calendar":"")+'</span>'+(!a.gcal&&a.estado!="hecho"?'<br><a class="b" style="margin-top:6px;padding:7px 11px;font-size:14px" target="_blank" rel="noopener" data-gcal="'+esc(a.id)+'" href="'+esc(TR.gcalLink(a,c))+'">Pasar a Google Calendar</a>':"")+'</span>'+(a.estado!="hecho"?'<button class="b" data-hecho="'+esc(a.id)+'">Hecho</button>':"")+'</div>'}).join(""):'<div class="gris">Nada agendado. Tocá “+ Agendar”.</div>')+'</div>';
  s+='<div class="card"><div class="fila" style="justify-content:space-between"><b>Datos</b><button class="b" data-datos>Editar</button></div><dl class="datos"><dt>Teléfono</dt><dd>'+esc(c.telefono?telLindo(c.telefono):"—")+'</dd><dt>Dirección</dt><dd>'+esc(c.direccion||"—")+(c.zona?", "+esc(c.zona):"")+'</dd>'+(t?'<dt>Trabajo</dt><dd>'+esc(t.descripcion||t.tipo||"—")+'</dd>'+(t.monto?'<dt>Precio</dt><dd>$'+Number(t.monto).toLocaleString("es-AR")+'</dd>':""):"")+(c.origen?'<dt>Llegó por</dt><dd>'+esc(c.origen)+'</dd>':"")+(c.notas?'<dt>Notas</dt><dd>'+esc(c.notas)+'</dd>':"")+'</dl>'+
    (c.direccion?'<div class="fila"><a class="b" target="_blank" rel="noopener" href="https://www.google.com/maps/search/'+encodeURIComponent(c.direccion+", "+(c.zona||"La Plata"))+'">'+IC.mapa+'Cómo llegar</a></div>':"")+'</div>';
  s+='<div class="card"><div class="fila" style="justify-content:space-between"><b>Anotar algo</b></div><div class="dictar"><textarea id="txtNota" placeholder="Escribí o tocá el micrófono y dictá"></textarea>'+micBtn("txtNota")+'</div><div class="fila"><button class="b p" data-anotar>Guardar nota</button></div>'+
    (hs.length?'<details><summary class="gris" style="cursor:pointer;padding:4px 0">Notas anteriores ('+hs.length+')</summary>'+hs.map(function(n){return'<div style="border-left:3px solid var(--linea);padding:2px 0 2px 10px;margin-top:6px">'+esc(n.texto)+'<div class="gris" style="font-size:12.5px">'+(n.ts?new Date(n.ts).toLocaleString("es-AR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"")+(n.autor?" · "+esc(n.autor):"")+'</div></div>'}).join("")+'</details>':"")+'</div>';
  return s+'</div>'}

function pCalendario(){var h=iso(),ags=agendaDe().filter(function(a){return a.estado!="hecho"&&S.clientes[a.clienteId]});
  var hoy=ags.filter(function(a){return a.fecha<=h}),prox=ags.filter(function(a){return a.fecha>h});
  var s='<div class="pila" style="max-width:720px;margin:0 auto"><button class="b p ancho" data-oir-dia style="padding:15px;font:700 17px var(--display)">'+IC.oir.replace("<svg",'<svg width="22" height="22"')+' Escuchar lo de hoy</button>';
  function bloque(tit,l,v){return"<h2>"+tit+"</h2>"+(l.length?'<div class="card">'+l.map(function(a){var c=cli(a.clienteId);return'<div class="ev est '+est(c.estado)+'" style="cursor:pointer;padding:6px 0;border-bottom:1px solid var(--linea)" data-ir="'+esc(a.clienteId)+'"><span class="h'+(a.fecha<h?" tarde":"")+'">'+esc(a.fecha<h?"Atrasado":a.fecha==h?(a.hora||"Hoy"):cuando(a.fecha,a.hora))+'</span><span style="flex:1;min-width:0"><b>'+esc(c.nombre)+'</b> · '+esc(a.que)+'<br><span class="gris">'+esc(c.direccion||"")+'</span></span></div>'}).join("")+'</div>':'<div class="card vacio">'+v+'</div>')}
  s+=bloque("Hoy",hoy,"Nada agendado para hoy.")+bloque("Próximos días",prox,"Nada agendado para los próximos días.");
  s+='<h2>Avisos en este celular</h2><div class="card" id="zonaAvisos"><div class="gris">Revisando…</div></div><div class="fila"><a class="b" target="_blank" rel="noopener" href="https://calendar.google.com/calendar/r">Abrir Google Calendar</a><button class="b" data-quien>Entrar como otra persona ('+esc(TR.quien()||"?")+')</button></div></div>';setTimeout(pintarAvisos,0);return s}
function pGcal(){if(!mcp)return'<div class="gris">Se ve cuando tu Google Calendar está conectado.</div>';
  if(S.cal==null){leerCal();return'<div class="gris">Leyendo el calendario…</div>'}
  if(S.cal.error)return'<div class="gris">'+esc(S.cal.error)+'</div>';
  if(!S.cal.length)return'<div class="gris">Nada hoy ni mañana.</div>';
  return S.cal.map(function(e){return'<div class="ev"><span class="h">'+esc(e.cuando)+'</span><span>'+esc(e.titulo)+'</span></div>'}).join("")}
async function leerCal(){if(S._leyendo)return;S._leyendo=true;
  try{var h=new Date();h.setHours(0,0,0,0);var f=new Date(h.getTime()+2*864e5);
    var r=await mcp.callTool("Google Calendar","list_events",{calendarId:CAL,startTime:iso(h)+"T00:00:00",endTime:iso(f)+"T00:00:00",orderBy:"startTime",pageSize:50});
    var p=r.payload||r.structuredContent||{};if(typeof p=="string"){try{p=JSON.parse(p)}catch(e){p={}}}
    if(!p.events&&r.content&&r.content[0]&&r.content[0].text){try{p=JSON.parse(r.content[0].text)}catch(e){}}
    S.cal=(p.events||[]).filter(function(e){return!/Mateo/.test(e.summary||"")}).map(function(e){var st=e.start||{},dt=st.dateTime||st.date||"";return{cuando:(dt.slice(0,10)==iso()?"Hoy":"Mañana")+(st.dateTime?" "+dt.slice(11,16):""),titulo:e.summary||"(sin título)"}});
  }catch(e){S.cal={error:e&&e.code=="not_granted"?"No diste permiso para leer el calendario.":"No pude leer el calendario ahora."}}
  S._leyendo=false;var el=$("gcal");if(el)el.innerHTML=pGcal()}

function pNovedades(){var av=novedades(),ms=lista(S.mensajes).filter(function(m){return m.estado=="aprobado"});
  var s='<div class="pila" style="max-width:720px;margin:0 auto"><h2>Novedades</h2>';
  if(!av.length)s+='<div class="card vacio">No hay novedades. Cuando un cliente escriba por WhatsApp, Facebook o Instagram, aparece acá.</div>';
  s+=av.map(function(a){var c=a.clienteId?S.clientes[a.clienteId]:null;return'<div class="card'+(c?" est "+est(c.estado):"")+'" style="border-left:5px solid var(--c,var(--oro))"><b style="font-size:17px">'+esc(a.titulo)+'</b><div>'+esc(a.detalle)+'</div><div class="gris">'+esc([a.origen,a.ts?hace(a.ts):""].filter(Boolean).join(" · "))+'</div><div class="fila">'+(c?'<button class="b p" data-ir="'+esc(a.clienteId)+'">Ver cliente</button>':"")+'<button class="b" data-oir-aviso="'+esc(a.id)+'">'+IC.oir.replace("<svg",'<svg width="20" height="20"')+'Escuchar</button><button class="b" data-listo="'+esc(a.id)+'">Ya está</button></div></div>'}).join("");
  if(ms.length)s+='<h2>Para mandar desde la PC</h2>'+ms.map(function(m){return'<div class="card"><b>'+esc(cli(m.clienteId).nombre)+'</b><div>'+esc(m.texto)+'</div><div class="gris">Sale en la próxima revisión de la PC.</div></div>'}).join("");
  return s+'</div>'}

/* ---------- hojas (cada acción) ---------- */
function abrirHoja(html,viva){$("hoja").innerHTML=html;$("hoja").hidden=false;$("velo").hidden=false;S._hojaViva=viva||null;ligarHoja()}
function cerrarHoja(){pararDictado();S._alDictar=null;$("hoja").hidden=true;$("velo").hidden=true;S._hojaViva=null;pintar()}
$("velo").onclick=cerrarHoja;
function cabHoja(t,sub){return'<div class="fila" style="justify-content:space-between;flex-wrap:nowrap"><div><h3>'+esc(t)+'</h3>'+(sub?'<div class="gris">'+esc(sub)+'</div>':"")+'</div><button class="b" data-cerrar>Cerrar</button></div>'}
function ligarHoja(){var h=$("hoja");h.querySelectorAll("[data-cerrar]").forEach(function(b){b.onclick=cerrarHoja});h.querySelectorAll("[data-mic]").forEach(function(b){b.onclick=function(){dictar(b)}})}

function hojaEstado(cid){var c=cli(cid),e=est(c.estado);
  abrirHoja(cabHoja("¿En qué estado está?",c.nombre)+'<div class="chips est-ch">'+ESTADOS.map(function(x){return'<button class="est '+x+'" data-e="'+x+'" aria-pressed="'+(x==e)+'">'+NOMBRE_E[x]+'</button>'}).join("")+'</div><div class="gris">Al tocar uno, queda guardado.</div>');
  $("hoja").querySelectorAll("[data-e]").forEach(function(b){b.onclick=async function(){var x=b.dataset.e,t=trabajoActivo(cid);
    try{await db.doc("clientes/"+cid).update({estado:x,ts:Date.now()});if(t)await db.doc("trabajos/"+t.id).update({estado:x,ts:Date.now(),hecho:x=="terminado"});await nota(cid,"Estado → "+NOMBRE_E[x]);aviso(c.nombre+": "+NOMBRE_E[x]);cerrarHoja()}catch(err){aviso("No se pudo guardar")}}})}

function hojaWhatsApp(cid,texto){var c=cli(cid);
  abrirHoja(cabHoja("Mensaje por WhatsApp","Para "+c.nombre+" · "+telLindo(c.telefono))+'<div class="dictar"><textarea id="txtWa" placeholder="Escribí o tocá el micrófono y dictá el mensaje">'+esc(texto||"")+'</textarea>'+micBtn("txtWa")+'</div>'+
    '<a class="b wa ancho" id="waIr" target="_blank" rel="noopener" href="'+esc(waLink(c.telefono,texto))+'">'+IC.wa+'Abrir WhatsApp con el mensaje</a>'+
    '<button class="b ancho" id="waPc">Que lo mande la PC en la próxima revisión</button><div class="gris">“Abrir WhatsApp” abre el chat con el mensaje escrito: solo tocás enviar.</div>');
  var tx=$("txtWa"),a=$("waIr");function act(){a.href=waLink(c.telefono,tx.value.trim())}tx.oninput=act;S._alDictar=act;
  a.addEventListener("click",function(){var v=tx.value.trim();if(v){db.collection("mensajes").add({clienteId:cid,texto:v,estado:"abierto en WhatsApp",por:S.yo||"",ts:Date.now()});nota(cid,"Se abrió WhatsApp con: "+v)}setTimeout(cerrarHoja,400)});
  $("waPc").onclick=async function(){var v=tx.value.trim();if(!v)return aviso("Escribí o dictá el mensaje");await db.collection("mensajes").add({clienteId:cid,texto:v,estado:"aprobado",aprobadoPor:S.yo||"",ts:Date.now()});await nota(cid,"WhatsApp para mandar desde la PC: "+v);aviso("Queda para la próxima revisión");cerrarHoja()}}

function hojaConversacion(cid){var c=cli(cid);function html(){var ch=chatDe(cid);return cabHoja("Conversación",c.nombre)+
    (c.resumenChat?'<div class="card" style="box-shadow:none"><b>Resumen</b><div>'+esc(c.resumenChat)+'</div></div>':"")+
    (ch.length?'<div class="chat" id="chat">'+ch.map(function(m){return'<div class="burb '+(m.de=="yo"?"yo":"el")+'">'+(m.audio?'<span class="aud">🎤 audio pasado a texto</span><br>':"")+esc(m.texto)+'<small>'+(m.de=="yo"?"Nosotros":esc(c.nombre.split(" ")[0]))+(m.ts?" · "+new Date(m.ts).toLocaleString("es-AR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"")+'</small></div>'}).join("")+'</div>':'<div class="gris">Todavía no hay conversación guardada. Se trae sola en la próxima revisión de la PC.</div>')+
    '<div class="fila">'+(ch.length?'<button class="b o" id="oirChat">'+IC.oir+'Escuchar la conversación</button>':"")+(c.telefono?'<button class="b wa" id="contestar">'+IC.wa+'Contestar</button>':"")+'</div>'}
  function viva(){$("hoja").innerHTML=html();ligarHoja();var k=$("chat");if(k)k.scrollTop=k.scrollHeight;
    var o=$("oirChat");if(o)o.onclick=function(){var ch=chatDe(cid).slice(-12),n=c.nombre.split(" ")[0];hablar((c.resumenChat?"Resumen: "+c.resumenChat+". Ahora la conversación. ":"")+ch.map(function(m){return(m.de=="yo"?"Nosotros":n)+(m.audio?" mandó un audio que dice":" dijo")+": "+m.texto}).join(". "))};
    var r=$("contestar");if(r)r.onclick=function(){hojaWhatsApp(cid,c.sugerencia||"")}}
  abrirHoja("",viva);viva()}

var AVISOS=[{m:0,t:"A la hora"},{m:15,t:"15 min antes"},{m:60,t:"1 hora antes"},{m:120,t:"2 horas antes"},{m:"noche",t:"La noche anterior"},{m:1440,t:"1 día antes"}];
function textoAviso(l){if(!l||!l.length)return"Sin aviso";return"Aviso: "+l.map(function(m){var x=AVISOS.filter(function(a){return a.m===m||String(a.m)==String(m)})[0];return x?x.t.toLowerCase():m+" min antes"}).join(", ")}
function hojaAgendar(cid){var c=cli(cid),q=queQuedo(c),st={que:"",fecha:"",hora:"",avisos:[60]};
  var hoy=new Date(),dias=[];for(var i=0;i<8;i++){var d=new Date(hoy.getTime()+i*864e5);dias.push({f:iso(d),t:i==0?"Hoy":i==1?"Mañana":mayus(DIAS[d.getDay()])+" "+d.getDate()})}
  var horas=["08:00","09:00","10:00","11:00","12:00","14:00","15:00","16:00","17:00","18:00"];
  abrirHoja(cabHoja("Agendar",c.nombre)+
   '<div class="paso">1 · ¿Qué hay que hacer?</div><div class="dictar"><textarea id="agQue" placeholder="Ej: ir a ver la canaleta, llevar presupuesto, cobrar…">'+esc(q.que!=QUE_E[est(c.estado)]?q.que:"")+'</textarea>'+micBtn("agQue")+'</div>'+
   '<div class="paso">2 · ¿Qué día?</div><div class="chips" id="agDias">'+dias.map(function(d){return'<button data-f="'+d.f+'" aria-pressed="false">'+d.t+'</button>'}).join("")+'</div><input type="date" id="agFecha" aria-label="Otro día">'+
   '<div class="paso">3 · ¿A qué hora?</div><div class="chips" id="agHoras"><button data-h="" aria-pressed="false">Sin hora</button>'+horas.map(function(h){return'<button data-h="'+h+'" aria-pressed="false">'+h.replace(":00","")+' h</button>'}).join("")+'</div><input type="time" id="agHora" aria-label="Otra hora">'+
   '<div class="paso">4 · ¿Cuándo querés que te avise?</div><div class="chips" id="agAv">'+AVISOS.map(function(a){return'<button data-m="'+a.m+'" aria-pressed="'+(a.m===60)+'">'+a.t+'</button>'}).join("")+'</div>'+
   '<button class="b p ancho" id="agGuardar" style="padding:15px;font-size:17px">Guardar en el calendario</button><div class="gris" id="agRes"></div>');
  var H=$("hoja");
  H.querySelectorAll("#agDias [data-f]").forEach(function(b){b.onclick=function(){st.fecha=b.dataset.f;$("agFecha").value=st.fecha;marca("#agDias",b)}});
  $("agFecha").onchange=function(){st.fecha=this.value;marca("#agDias",null)};
  H.querySelectorAll("#agHoras [data-h]").forEach(function(b){b.onclick=function(){st.hora=b.dataset.h;$("agHora").value=st.hora;marca("#agHoras",b)}});
  $("agHora").onchange=function(){st.hora=this.value;marca("#agHoras",null)};
  H.querySelectorAll("#agAv [data-m]").forEach(function(b){b.onclick=function(){var m=b.dataset.m=="noche"?"noche":Number(b.dataset.m),i=st.avisos.indexOf(m);if(i>=0)st.avisos.splice(i,1);else st.avisos.push(m);b.setAttribute("aria-pressed",i<0)}});
  function marca(sel,b){H.querySelectorAll(sel+" button").forEach(function(x){x.setAttribute("aria-pressed",x===b)})}
  $("agGuardar").onclick=async function(){st.que=$("agQue").value.trim();if(!st.que)return aviso("Decí o escribí qué hay que hacer");if(!st.fecha)return aviso("Elegí el día");
    var btn=this;btn.disabled=true;btn.textContent="Guardando…";
    var doc={clienteId:cid,que:st.que,fecha:st.fecha,hora:st.hora||"",avisos:st.avisos.slice(),estado:"pendiente",ts:Date.now(),por:S.yo||""};
    var ref=await db.collection("agenda").add(doc);
    var t=trabajoActivo(cid);if(t)await db.doc("trabajos/"+t.id).update({proxima:st.que,fecha:st.fecha,hora:st.hora||"",ts:Date.now()});
    await nota(cid,"Agendado "+dicho(st.fecha,st.hora)+": "+st.que);
    var ok=await alCalendario(ref.id,doc,c);
    pasoFinal(ref.id,doc,c)}}
async function alCalendario(id,a,c){if(!mcp)return false;
  var titulo=a.que+" – "+c.nombre+(c.telefono?", Tel "+soloNum(c.telefono).slice(-10):"");
  var args={calendarId:CAL,summary:titulo,location:[c.direccion,c.zona].filter(Boolean).join(", "),description:"Cargado desde Techos Rey · Clientes"};
  var ini;if(a.hora){ini=new Date(a.fecha+"T"+a.hora+":00");var fin=new Date(ini.getTime()+36e5);args.startTime=a.fecha+"T"+a.hora+":00";args.endTime=iso(fin)+"T"+fin.toTimeString().slice(0,8)}
  else{ini=new Date(a.fecha+"T00:00:00");args.allDay=true;args.startTime=a.fecha+"T00:00:00";args.endTime=iso(new Date(fd(a.fecha).getTime()+864e5))+"T00:00:00"}
  var rem=a.avisos.map(function(m){if(m=="noche"){var n=new Date(fd(a.fecha).getTime()-864e5);n.setHours(20,0,0,0);return Math.max(0,Math.round((ini-n)/60000))}return Number(m)}).filter(function(m){return m>=0&&m<=40320});
  args.overrideReminders=rem.map(function(m){return{method:"popup",minutes:m}});if(!rem.length)args.useDefaultReminders=false;
  try{var r=await mcp.callTool("Google Calendar","create_event",args);var p=r.payload||r.structuredContent||{};if(typeof p=="string"){try{p=JSON.parse(p)}catch(e){p={}}}
    await db.doc("agenda/"+id).update({gcal:p.id||"creado"});S.cal=null;return true}catch(e){return false}}

function hojaDatos(cid){var c=cli(cid),t=trabajoActivo(cid)||{};
  abrirHoja(cabHoja("Datos del cliente",c.nombre)+
   '<label for="dNom">Nombre</label><input id="dNom" value="'+esc(c.nombre)+'">'+
   '<label for="dTel">Teléfono (WhatsApp)</label><input id="dTel" inputmode="tel" value="'+esc(c.telefono?telLindo(c.telefono):"")+'" placeholder="221 555-1234">'+
   '<label for="dDir">Dirección</label><input id="dDir" value="'+esc(c.direccion||"")+'" placeholder="Calle y número, entre calles">'+
   '<label for="dZona">Zona</label><input id="dZona" value="'+esc(c.zona||"La Plata")+'">'+
   '<label for="dTrab">Trabajo</label><input id="dTrab" value="'+esc(t.descripcion||"")+'" placeholder="Ej: canaleta 12 m, membrana en terraza">'+

   '<label for="dNotas">Notas</label><div class="dictar"><textarea id="dNotas">'+esc(c.notas||"")+'</textarea>'+micBtn("dNotas")+'</div>'+
   '<label for="dFalta">Falta saber</label><input id="dFalta" value="'+esc(c.falta||"")+'">'+
   '<button class="b p ancho" id="dGuardar" style="padding:15px;font-size:17px">Guardar</button>');
  $("dGuardar").onclick=async function(){var nom=$("dNom").value.trim();if(!nom)return aviso("Falta el nombre");var tel=soloNum($("dTel").value);if(tel.length==10)tel="549"+tel;
    var d={nombre:nom,telefono:tel?"+"+tel:"",direccion:$("dDir").value.trim(),zona:$("dZona").value.trim(),notas:$("dNotas").value.trim(),falta:$("dFalta").value.trim(),ts:Date.now()};
    var td={descripcion:$("dTrab").value.trim(),proxima:$("dQue").value.trim(),ts:Date.now()},mo=Number(soloNum($("dMonto").value));if(mo)td.monto=mo;
    try{if(cid){await db.doc("clientes/"+cid).update(d);if(t.id)await db.doc("trabajos/"+t.id).update(td);else await db.collection("trabajos").add(Object.assign({clienteId:cid,estado:est(c.estado)},td))}
      else{d.estado="llamar";d.origen="a mano";var r=await db.collection("clientes").add(d);await db.collection("trabajos").add(Object.assign({clienteId:r.id,estado:"llamar"},td));S.abierto=r.id}
      aviso("Guardado");cerrarHoja()}catch(e){aviso("No se pudo guardar")}}}

function pasoFinal(id,a,c){
  abrirHoja(cabHoja("Listo, quedó agendado",c.nombre)+'<div class="quedo est '+est(c.estado)+'"><span class="t">'+esc(cuando(a.fecha,a.hora))+'</span><span class="q">'+esc(a.que)+'</span><span>'+esc(textoAviso(a.avisos))+'</span></div>'+
   '<div class="gris">Los avisos llegan como notificación a los celulares que los tengan activados (pestaña Calendario).</div>'+

  $("pfG").addEventListener("click",function(){db.doc("agenda/"+id).update({gcal:"a mano"});setTimeout(cerrarHoja,500)})}
function pintarAvisos(){var z=$("zonaAvisos");if(!z)return;TR.avisosEstado().then(function(e){var z=$("zonaAvisos");if(!z)return;
  if(e=="activo")z.innerHTML='<div><b style="color:var(--e-cobrar)">✓ Avisos activados.</b> Te llegan a la hora que elegís al agendar, y un “buen día” a las 7:30 con lo de hoy.</div>';
  else if(e=="no")z.innerHTML='<div class="gris">Este navegador no puede recibir avisos. En el celular, abrí la app en Chrome y agregala a la pantalla principal.</div>';

  else{z.innerHTML='<div>Activá los avisos para que el celular te recuerde lo agendado.</div><button class="b o ancho" id="actAv">🔔 Activar avisos en este celular</button>';
    $("actAv").onclick=function(){var b=this;b.disabled=true;b.textContent="Activando…";TR.activarAvisos().then(function(){aviso("Listo: te mandé un aviso de prueba");pintarAvisos()}).catch(function(err){b.disabled=false;b.textContent="🔔 Activar avisos en este celular";aviso(String(err&&err.message)=="permiso"?"Hay que tocar Permitir para recibir avisos":"No se pudieron activar. Probá de nuevo")})}}})}

/* ---------- eventos ---------- */
function ligar(){
  document.querySelectorAll("[data-stop]").forEach(function(e){e.addEventListener("click",function(ev){ev.stopPropagation()})});
  document.querySelectorAll("[data-abrir]").forEach(function(e){e.onclick=function(){S.abierto=e.dataset.abrir;S._foco=false;pintar();scrollTo(0,0)};e.onkeydown=function(ev){if(ev.key=="Enter"&&ev.target===e)e.onclick()}});
  document.querySelectorAll("[data-ir]").forEach(function(e){e.onclick=function(){S.tab="clientes";S.abierto=e.dataset.ir;pintar();scrollTo(0,0)}});
  document.querySelectorAll("[data-volver]").forEach(function(e){e.onclick=function(){S.abierto=null;pintar()}});
  var bu=$("buscar");if(bu)bu.oninput=function(){S.buscar=bu.value.toLowerCase();S._foco=true;pintar()};
  document.querySelectorAll("[data-filtro]").forEach(function(b){b.onclick=function(){S.filtro=b.dataset.filtro;S._foco=false;pintar()}});

  document.querySelectorAll("[data-agendar]").forEach(function(b){b.onclick=function(ev){ev.stopPropagation();hojaAgendar(b.dataset.agendar)}});
  document.querySelectorAll("[data-oir]").forEach(function(b){b.onclick=function(ev){ev.stopPropagation();oirCliente(b.dataset.oir)}});
  document.querySelectorAll("[data-conv]").forEach(function(b){b.onclick=function(){hojaConversacion(S.abierto)}});
  document.querySelectorAll("[data-escribir]").forEach(function(b){b.onclick=function(){hojaWhatsApp(S.abierto,b.dataset.escribir=="sug"?cli(S.abierto).sugerencia:"")}});
  document.querySelectorAll("[data-datos]").forEach(function(b){b.onclick=function(){hojaDatos(S.abierto)}});
  document.querySelectorAll("[data-hecho]").forEach(function(b){b.onclick=function(){db.doc("agenda/"+b.dataset.hecho).update({estado:"hecho",hechoTs:Date.now()}).then(function(){aviso("Marcado como hecho")})}});
  document.querySelectorAll("[data-anotar]").forEach(function(b){b.onclick=async function(){var v=$("txtNota").value.trim();if(!v)return aviso("Escribí o dictá la nota");pararDictado();await nota(S.abierto,v);aviso("Nota guardada")}});
  document.querySelectorAll("[data-oir-dia]").forEach(function(b){b.onclick=oirDia});

  document.querySelectorAll("[data-oir-aviso]").forEach(function(b){b.onclick=function(){var a=S.avisos[b.dataset.oirAviso];hablar(a.titulo+". "+a.detalle)}});
  document.querySelectorAll("[data-listo]").forEach(function(b){b.onclick=function(){db.doc("avisos/"+b.dataset.listo).update({estado:"atendido",atendidoTs:Date.now()})}});

document.querySelectorAll("#nav button").forEach(function(b){b.onclick=function(){S.tab=b.dataset.t;if(S.tab=="clientes"&&S.tab==b.dataset.t)S.abierto=null;pintar();scrollTo(0,0)}});

/* ---------- escuchar (voz) ---------- */
function hablar(txt){txt=String(txt).replace(/\$ ?([\d.]+)/g,"$1 pesos").replace(/[•✓🎤]/g,"");
  if(tts){$("callar").hidden=false;tts.speak(txt.slice(0,1990),{language:"es"}).then(function(){$("callar").hidden=true}).catch(function(e){$("callar").hidden=true;if(e&&["viewer_stopped","stopped","busy","cancelled"].indexOf(e.code)<0)hablarEquipo(txt)});return}
  hablarEquipo(txt)}
function hablarEquipo(txt){if(!("speechSynthesis" in window))return aviso("Este equipo no tiene voz");speechSynthesis.cancel();
  var vs=speechSynthesis.getVoices().filter(function(x){return/^es/i.test(x.lang)}).sort(function(a,b){function o(v){return(/natural|online|neural|google/i.test(v.name)?0:4)+(/AR|419|US|MX/.test(v.lang)?0:1)}return o(a)-o(b)});
  var partes=txt.match(/[^.!?]+[.!?]*/g)||[txt];$("callar").hidden=false;
  partes.forEach(function(p,i){var u=new SpeechSynthesisUtterance(p.trim());u.lang="es-AR";if(vs[0])u.voice=vs[0];if(i==partes.length-1)u.onend=u.onerror=function(){$("callar").hidden=true};speechSynthesis.speak(u)})}
$("callar").onclick=function(){try{if(tts)tts.stop().catch(function(){})}catch(e){}if("speechSynthesis" in window)speechSynthesis.cancel();$("callar").hidden=true};
function oirCliente(cid){var c=cli(cid),e=est(c.estado),q=queQuedo(c),t=trabajoActivo(cid);
  hablar(c.nombre+". Está en "+NOMBRE_E[e]+". Qué quedó: "+q.que+", "+dicho(q.f,q.h)+". "+(t&&t.descripcion?"El trabajo: "+t.descripcion+(t.monto?", "+t.monto+" pesos":"")+". ":"")+(c.direccion?"Queda en "+c.direccion+". ":"")+(c.resumenChat?"De la conversación: "+c.resumenChat+" ":"")+(c.falta?"Falta saber: "+c.falta.replace(/[¿?]/g,"")+".":""))}
function oirDia(){var h=iso(),d=new Date(),ags=agendaDe().filter(function(a){return a.estado!="hecho"&&S.clientes[a.clienteId]});
  var hoy=ags.filter(function(a){return a.fecha<=h}),prox=ags.filter(function(a){return a.fecha>h}).slice(0,4);
  var t=(d.getHours()<13?"Buen día":d.getHours()<20?"Buenas tardes":"Buenas noches")+(S.yo?", "+S.yo:"")+". Hoy es "+DIAS[d.getDay()]+" "+d.getDate()+" de "+MESES[d.getMonth()]+". ";
  t+=hoy.length?"Para hoy: "+hoy.map(function(a){var c=cli(a.clienteId);return(a.fecha<h?"atrasado, ":"")+(a.hora?"a las "+a.hora.replace(":00","")+", ":"")+c.nombre+", "+a.que+(c.direccion?", en "+c.direccion:"")}).join(". ")+". ":"Hoy no hay nada agendado. ";
  if(prox.length)t+="Después: "+prox.map(function(a){return cli(a.clienteId).nombre+" "+dicho(a.fecha,a.hora)+", "+a.que}).join(". ")+".";
  var n=novedades().length;if(n)t+=" Y hay "+n+(n==1?" novedad":" novedades")+" para mirar.";hablar(t)}

/* ---------- dictar ---------- */
var dictando=null,des=[];
function micBtn(id){return'<button class="mic" data-mic="'+id+'" aria-label="Dictar">'+IC.mic+'</button>'}
function pararDictado(){if(dictando&&dict)dict.stop().catch(function(){})}
function dictar(btn){var campo=$(btn.dataset.mic);
  if(!dict){campo.focus();return aviso("Tocá el micrófono del teclado del celular y hablá")}
  if(dictando){dict.stop().catch(function(){});return}
  var base=campo.value?campo.value.replace(/\s*$/," "):"",fijo="";var p=dict.start({language:"es"});
  dictando=btn;btn.dataset.on="1";des.forEach(function(f){try{f()}catch(e){}});des=[];
  function listo(){if(S._alDictar)S._alDictar()}
  des.push(dict.onPartial(function(r){campo.value=base+fijo+r.text;listo()}));
  des.push(dict.onFinal(function(r){fijo+=r.text+" ";campo.value=base+fijo;listo()}));
  des.push(dict.onState(function(r){if(r.state=="idle"){btn.dataset.on="0";dictando=null;des.forEach(function(f){try{f()}catch(e){}});des=[]}}));
  p.catch(function(e){btn.dataset.on="0";dictando=null;if(e&&e.code!="stopped"){campo.focus();aviso(e.code=="not_granted"?"Sin permiso de micrófono: usá el del teclado":"Usá el micrófono del teclado")}})}

iniciar();
})();
